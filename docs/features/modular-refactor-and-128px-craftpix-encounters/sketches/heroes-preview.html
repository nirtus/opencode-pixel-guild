      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap');
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: background-color 0.35s ease;
      }
      .serif-title {
        font-family: 'Cinzel', Georgia, serif;
      }
      @keyframes floatIdle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulseHalo {
        0%, 100% { opacity: 0.75; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes crystalBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes sparkFlicker {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
        50% { transform: scale(1.35) rotate(25deg); opacity: 0.8; }
      }
      @keyframes bubbleRise {
        0% { transform: translateY(0px) scale(0.8); opacity: 0.9; }
        100% { transform: translateY(-14px) scale(1.2); opacity: 0; }
      }
      @keyframes breathCloud {
        0% { transform: translateY(0px) scale(0.5); opacity: 0; }
        30% { opacity: 0.85; }
        100% { transform: translateY(-36px) scale(1.55); opacity: 0; }
      }
      .anim-body { animation: floatIdle 2.6s ease-in-out infinite; }
      .anim-halo { animation: pulseHalo 2.4s ease-in-out infinite; transform-origin: center; }
      .anim-crystal { animation: crystalBob 2s ease-in-out infinite; }
      .anim-spark { animation: sparkFlicker 0.35s ease-in-out infinite; transform-origin: center; }
      .anim-bubble-1 { animation: bubbleRise 1.8s ease-out infinite; }
      .anim-bubble-2 { animation: bubbleRise 1.8s ease-out 0.9s infinite; }
      .anim-breath-1 { animation: breathCloud 2.4s ease-out infinite; }
      .anim-breath-2 { animation: breathCloud 2.4s ease-out 0.8s infinite; }
    </style>

      // ============================================================================
      // PARAMETRIC SVG HERO RIG GENERATOR (MATCHING docs/examples/characters ANATOMY)
      // ============================================================================
      function buildHeroSvg(hero, party, loadout, fxMode) {
        const p = party.primary;
        const s = party.secondary;
        const acc = party.accent;
        const met = party.metal;
        const metD = party.metalDark;

        // 1. Back Layer: Role Aura + Cleric Halo + Back Weapons/Capes/Packs
        let backLayer = `<circle cx="110" cy="145" r="72" fill="${party.aura}" />`;

        // Ground elliptical shadow
        backLayer += `<ellipse cx="110" cy="242" rx="48" ry="8" fill="rgba(0,0,0,0.14)" />`;

        if (hero.role === "WARRIOR") {
          // Full-length warrior cape behind body
          backLayer += `<path d="M 74,142 L 146,142 L 154,230 Q 110,236 66,230 Z" fill="${s}" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round" />`;
          if (loadout === "A") {
            // Upright broadsword behind left hand
            backLayer += `
              <g transform="translate(142, 48)">
                <polygon points="0,0 7,16 7,122 -7,122 -7,16" fill="#e6edf5" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>
                <line x1="0" y1="14" x2="0" y2="118" stroke="${INK}" stroke-width="1.8"/>
                <rect x="-15" y="120" width="30" height="7" rx="3.5" fill="#d49b35" stroke="${INK}" stroke-width="2.2"/>
              </g>
            `;
          } else {
            // Great battleaxe behind left shoulder
            backLayer += `
              <g transform="translate(142, 65)">
                <rect x="-3.5" y="10" width="7" height="145" rx="2" fill="#8c5220" stroke="${INK}" stroke-width="2.4"/>
                <path d="M 3,18 Q 28,12 32,34 Q 32,56 3,50 Z" fill="#dce3eb" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>
              </g>
            `;
          }
        } else if (hero.role === "MAGE") {
          if (loadout === "A") {
            // Tall wooden crystal staff
            backLayer += `
              <g transform="translate(145, 42)">
                <circle cx="0" cy="18" r="20" fill="${acc}" opacity="0.25" class="anim-halo"/>
                <path d="M -3,36 L -3,196 L 3,196 L 3,36 C 14,32 16,12 8,2 C 12,14 8,26 0,28 C -8,26 -12,14 -8,2 C -16,12 -14,32 -3,36 Z" fill="#9c5a25" stroke="${INK}" stroke-width="2.3" stroke-linejoin="round"/>
                <polygon points="0,-4 11,14 0,30 -11,14" fill="${acc}" stroke="${INK}" stroke-width="2.2" class="anim-crystal"/>
                <line x1="0" y1="-2" x2="0" y2="28" stroke="${INK}" stroke-width="1.4" class="anim-crystal"/>
              </g>
            `;
          } else {
            // Floating Arcane Orb with sparkles on left side

            <path d="M 80,74 L 106,32 Q 116,22 126,30 L 118,42 L 140,74 Z" fill="${p}" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
            <polygon points="84,68 136,68 138,75 82,75" fill="${s}" stroke="${INK}" stroke-width="2"/>
            <ellipse cx="110" cy="75" rx="44" ry="8" fill="${p}" stroke="${INK}" stroke-width="2.5"/>
            <polygon points="110,48 112,53 117,53 113,56 115,61 110,58 105,61 107,56 103,53 108,53" fill="${acc}" stroke="${INK}" stroke-width="1.5"/>
          `;
        } else if (hero.helm === "hood") {
          headLayer += `
            <path d="M 74,104 Q 72,52 110,52 Q 148,52 146,104 Q 142,76 110,76 Q 78,76 74,104 Z" fill="${p}" stroke="${INK}" stroke-width="2.5"/>
            <path d="M 79,82 Q 110,72 141,82" fill="none" stroke="${INK}" stroke-width="2.3"/>
          `;
        } else if (hero.helm === "bun" || hero.helm === "hair") {
          if (hero.helm === "bun") {
            headLayer += `<circle cx="110" cy="49" r="14" fill="${hero.hair}" stroke="${INK}" stroke-width="2.4"/>`;
          }
          // Alchemist Goggles on Forehead
          headLayer += `
            <rect x="80" y="73" width="60" height="6" fill="#7c4722" stroke="${INK}" stroke-width="2"/>
            <circle cx="98" cy="76" r="10" fill="#e6dcd2" stroke="${INK}" stroke-width="2.3"/>
            <circle cx="98" cy="76" r="6.5" fill="${acc}" stroke="${INK}" stroke-width="1.8"/>
            <circle cx="96" cy="74" r="2" fill="#ffffff"/>
            <circle cx="122" cy="76" r="10" fill="#e6dcd2" stroke="${INK}" stroke-width="2.3"/>
            <circle cx="122" cy="76" r="6.5" fill="${acc}" stroke="${INK}" stroke-width="1.8"/>
            <circle cx="120" cy="74" r="2" fill="#ffffff"/>
          `;
        } else if (hero.helm.includes("circlet")) {
          if (hero.helm === "bun-circlet") {
            headLayer += `<circle cx="110" cy="50" r="13" fill="${hero.hair}" stroke="${INK}" stroke-width="2.4"/>`;
          }
          headLayer += `
            <rect x="80" y="75" width="60" height="5" fill="#d4a634" stroke="${INK}" stroke-width="2"/>
            <polygon points="110,70 116,77.5 110,85 104,77.5" fill="${acc}" stroke="${INK}" stroke-width="2"/>
          `;
        } else if (hero.helm === "hardhat") {
          headLayer += `
            <path d="M 78,80 Q 78,52 110,52 Q 142,52 142,80 Z" fill="#f5b82e" stroke="${INK}" stroke-width="2.5"/>
            <rect x="72" y="77" width="76" height="6" rx="3" fill="#f5b82e" stroke="${INK}" stroke-width="2.4"/>
            <circle cx="110" cy="67" r="7.5" fill="#fff3c4" stroke="${INK}" stroke-width="2.2"/>
          `;
        }

        // 5. Optional In-Place Compaction Exhalation Cloud Effect
        let fxOverlay = "";
        if (fxMode === "exhale") {
          fxOverlay = `
            <g transform="translate(110, 108)">
              <g class="anim-breath-1">
                <ellipse cx="0" cy="-14" rx="22" ry="12" fill="#bae6fd" opacity="0.78" stroke="#38bdf8" stroke-width="1.5"/>
                <circle cx="-12" cy="-18" r="9" fill="#e0f2fe" opacity="0.85"/>
                <circle cx="14" cy="-16" r="10" fill="#e0f2fe" opacity="0.85"/>
              </g>
              <g class="anim-breath-2">
                <ellipse cx="6" cy="-24" rx="18" ry="10" fill="#e0f2fe" opacity="0.7"/>
                <circle cx="-8" cy="-28" r="4" fill="#ffffff"/>
                <circle cx="12" cy="-32" r="3" fill="#38bdf8"/>
              </g>
            </g>
          `;
        }

        return `
          <svg viewBox="0 0 220 260" class="w-full h-auto overflow-visible select-none">
            <g class="anim-body">
              ${backLayer}
              ${bodyLayer}
              ${headLayer}
              ${fxOverlay}
            </g>
          </svg>
        `;
      }

      function renderGallery() {
        const party = PARTIES[currentPartyIdx];
        const body = document.getElementById("page-body");
        body.style.backgroundColor = party.bg;
        body.style.color = party.textCol;

        document.getElementById("party-num").textContent = `PARTY ${party.id} · STEP 1 HERO SPECIFICATION`;
        document.getElementById("party-title").textContent = party.name;
        document.getElementById("party-motto").textContent = party.motto;
        document.getElementById("ref-image").src = party.refImg;

        // Render Party Tabs
        const tabs = document.getElementById("party-tabs");
        tabs.innerHTML = "";
        PARTIES.forEach((p, idx) => {
          const btn = document.createElement("button");
          const active = idx === currentPartyIdx;
          btn.className = `px-3.5 py-2 rounded-xl text-xs font-bold transition border ${
            active ? "bg-[#2a201c] text-white border-[#2a201c] shadow" : "bg-white/60 hover:bg-white border-black/10"
          }`;
          btn.textContent = `Party ${p.id} · ${p.name}`;
          btn.onclick = () => {
            currentPartyIdx = idx;
            renderGallery();
          };
          tabs.appendChild(btn);
        });

        // Render 6 Hero Cards
        const grid = document.getElementById("heroes-grid");
        grid.innerHTML = "";
        party.heroes.forEach((hero) => {
          const card = document.createElement("div");
          card.style.backgroundColor = party.cardBg;
          card.className = "rounded-3xl p-4 pb-6 shadow-sm border border-black/5 flex flex-col items-center justify-between transition hover:-translate-y-1 hover:shadow-md";
          card.innerHTML = `
            <div class="w-full">
              ${buildHeroSvg(hero, party, currentLoadout, currentFx)}
            </div>
            <div class="text-center mt-2">
              <div class="font-bold text-base tracking-tight">${hero.name}</div>
              <div class="text-[11px] font-semibold tracking-[0.18em] opacity-65 mt-0.5">${hero.role}</div>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      document.getElementById("btn-loadout-a").onclick = () => {
        currentLoadout = "A";
        document.getElementById("btn-loadout-a").className = "px-3 py-1.5 rounded-lg bg-[#2a201c] text-white transition";
        document.getElementById("btn-loadout-b").className = "px-3 py-1.5 rounded-lg hover:bg-black/5 transition";
        renderGallery();
      };
      document.getElementById("btn-loadout-b").onclick = () => {
        currentLoadout = "B";
        document.getElementById("btn-loadout-b").className = "px-3 py-1.5 rounded-lg bg-[#2a201c] text-white transition";
        document.getElementById("btn-loadout-a").className = "px-3 py-1.5 rounded-lg hover:bg-black/5 transition";
        renderGallery();
      };
      document.getElementById("btn-fx-idle").onclick = () => {
        currentFx = "idle";
        document.getElementById("btn-fx-idle").className = "px-3 py-1.5 rounded-lg bg-[#2a201c] text-white transition";
        document.getElementById("btn-fx-exhale").className = "px-3 py-1.5 rounded-lg hover:bg-black/5 transition";
        renderGallery();
      };
      document.getElementById("btn-fx-exhale").onclick = () => {
        currentFx = "exhale";
        document.getElementById("btn-fx-exhale").className = "px-3 py-1.5 rounded-lg bg-[#2a201c] text-white transition";
        document.getElementById("btn-fx-idle").className = "px-3 py-1.5 rounded-lg hover:bg-black/5 transition";
        renderGallery();
      };

      renderGallery();
    </script>
  </body>
</html>
